name: "論文調査"
description: "投稿予定研究に必要な関連研究を整理し、背景・前提・ライバル・周辺研究を構造化して記録します"
title: "[Paper Survey] "
labels:
  - "paper-survey"
projects:
  - "YokoyamaLab/16"

body:
  - type: markdown
    attributes:
      value: |
        # 論文調査

        このIssueは `YokoyamaLab/papers-bank` の既存テンプレートをベースに、関連研究調査用として移植したものです。

        - Project 16 では Scope を `Paper Survey` とします。
        - このIssueには週次の Iteration は割り当てません。
        - まだ調査途中でもIssueを作成し、見つけた論文を継続的に追加してください。
        - 単に論文を列挙するのではなく、自分の研究との関係を明記してください。

  - type: input
    id: research-title
    attributes:
      label: "対象研究・論文の仮題"
      description: "何のための論文調査なのか分かる名称を書いてください"
    validations:
      required: true

  - type: textarea
    id: research-summary
    attributes:
      label: "どのような研究か"
      description: "一段落で研究の概要を書いてください"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "この研究で解決しようとしている問題"
      description: "具体的に記述してください"
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: "うまくいけばどのような成果が得られるか"
      description: "仮説段階でも構いません。期待する成果を書いてください"
    validations:
      required: true

  - type: textarea
    id: evaluation-plan
    attributes:
      label: "評価としてどのようなグラフ・表を示す計画か"
      description: "縦軸、横軸、比較対象、評価指標なども書いてください"
      placeholder: |
        - Figure/Table:
        - X-axis:
        - Y-axis:
        - Baseline:
        - Metric:
    validations:
      required: false

  - type: textarea
    id: required-data
    attributes:
      label: "評価に必要なデータ"
      description: "どのようなデータが必要になるかを書いてください"
    validations:
      required: false

  - type: textarea
    id: required-implementation
    attributes:
      label: "必要な実装・分析"
      description: "必要な実装、前処理、分析などを書いてください"
    validations:
      required: false

  - type: textarea
    id: system-sketch
    attributes:
      label: "システムのポンチ絵・構成メモ"
      description: "画像を貼るか、構成を文章・Mermaidなどで記述してください"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## 関連研究

        以下は `papers-bank` の分類を踏襲しています。

  - type: textarea
    id: background-papers
    attributes:
      label: "提案手法の背景を説明するための関連研究（最低2件）"
      description: "研究領域の背景・必要性を説明するために引用する論文です"
      value: |
        1. 著者、タイトル、会議名・論文誌名、発表年、URL/DOI
           - 1行で概要:
           - 自分の研究との関係:

        2. 著者、タイトル、会議名・論文誌名、発表年、URL/DOI
           - 1行で概要:
           - 自分の研究との関係:
    validations:
      required: true

  - type: textarea
    id: prerequisite-papers
    attributes:
      label: "提案手法の前提となる関連研究（最低2件）"
      description: "自分の手法が利用・拡張・前提としている技術や研究です"
      value: |
        1. 著者、タイトル、会議名・論文誌名、発表年、URL/DOI
           - 1行で概要:
           - どの部分を前提としているか:

        2. 著者、タイトル、会議名・論文誌名、発表年、URL/DOI
           - 1行で概要:
           - どの部分を前提としているか:
    validations:
      required: true

  - type: textarea
    id: rival-papers
    attributes:
      label: "提案手法の直接的なライバルとなる関連研究（最低2件）"
      description: "同じ問題を解き、比較対象になり得る研究です。比較実験可能かも記述してください"
      value: |
        1. 著者、タイトル、会議名・論文誌名、発表年、URL/DOI
           - 概要:
           - 提案手法との違い:
           - 比較実験可能か:

        2. 著者、タイトル、会議名・論文誌名、発表年、URL/DOI
           - 概要:
           - 提案手法との違い:
           - 比較実験可能か:
    validations:
      required: true

  - type: textarea
    id: peripheral-papers
    attributes:
      label: "同じような目的を持つが直接のライバルではない周辺研究（最低4件）"
      description: "目的や応用領域は近いが、直接比較の対象にはならない研究です"
      value: |
        1. 著者、タイトル、会議名・論文誌名、発表年、URL/DOI
           - 概要:
           - なぜ直接のライバルではないか:

        2. 著者、タイトル、会議名・論文誌名、発表年、URL/DOI
           - 概要:
           - なぜ直接のライバルではないか:

        3. 著者、タイトル、会議名・論文誌名、発表年、URL/DOI
           - 概要:
           - なぜ直接のライバルではないか:

        4. 著者、タイトル、会議名・論文誌名、発表年、URL/DOI
           - 概要:
           - なぜ直接のライバルではないか:
    validations:
      required: true

  - type: textarea
    id: survey-summary
    attributes:
      label: "調査から分かったこと"
      description: "既存研究の空白、差別化ポイント、研究方針の変更などを整理してください"
      value: |
        ### 既存研究で既にできていること
        -

        ### まだ十分に解決されていないこと
        -

        ### 自分の研究の差別化ポイント
        -

        ### 調査を踏まえて変更したいこと
        -
    validations:
      required: true

  - type: textarea
    id: links
    attributes:
      label: "リンク集"
      value: |
        ### 論文・文献管理
        -

        ### Overleaf
        https://

        ### GitHub
        https://

        ### その他
        -
    validations:
      required: false
